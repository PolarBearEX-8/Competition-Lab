name: Daily AI Research
on:
  schedule:
    - cron: '17 20 * * *' # 03:17 Asia/Bangkok; avoids busy top of hour
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ai-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/daily-research.test.mjs
      - name: Search and validate
        run: node scripts/daily-research.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - run: npm run build
      - name: Commit only validated data and evidence
        id: commit
        run: |
          git config user.name 'competition-lab-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/researched.json
          if [ -d research ]; then git add research/; fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore: daily web research update'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger deploy.yml; publish the tested build here.
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: dist
  deploy:
    if: needs.research.outputs.changed == 'true'
    needs: research
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
